<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maandoverzicht</title>
<meta name="theme-color" content="#EDEFE8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Budget">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root {
  --paper: #EDEFE8;
  --card: #F8F9F4;
  --ink: #16180F;
  --muted: #6B7060;
  --rule: #D6D9CC;
  --accent: #2B4CF0;
  --done: #9AA08D;
  --neg: #A6321F;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: var(--paper); }
body {
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
  padding: max(20px, env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom));
  max-width: 620px;
  margin: 0 auto;
  min-height: 100vh;
}

.eyebrow {
  font-size: 10px; letter-spacing: .18em; text-transform: uppercase;
  color: var(--muted); font-weight: 600; margin-bottom: 6px;
}
.monthnav { display: flex; align-items: center; gap: 4px; margin-bottom: 22px; }
#month { font-size: 26px; font-weight: 700; letter-spacing: -.02em; text-transform: lowercase; }
.arrow {
  background: none; border: none; cursor: pointer; color: var(--muted);
  font-size: 28px; line-height: 1; padding: 0 10px; font-family: inherit;
}
.arrow:active { color: var(--ink); }

.summary {
  background: var(--card); border: 1px solid var(--rule);
  border-radius: 3px; padding: 20px 18px 16px; margin-bottom: 26px;
}
.biglabel {
  font-size: 10px; letter-spacing: .16em; text-transform: uppercase;
  color: var(--muted); font-weight: 600; display: block;
}
#available {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 40px; font-weight: 600; letter-spacing: -.03em; color: var(--accent);
  font-variant-numeric: tabular-nums; line-height: 1.15; display: block;
}
.bighint { font-size: 12px; color: var(--muted); display: block; }

.bar { display: flex; height: 5px; background: var(--rule); border-radius: 3px; overflow: hidden; margin: 18px 0 16px; }
#barPaid { background: var(--accent); transition: width .25s ease; }
#barTodo { background: var(--accent); opacity: .28; transition: width .25s ease; }

.stats { display: flex; gap: 28px; border-top: 1px solid var(--rule); padding-top: 14px; }
.stat { display: flex; flex-direction: column; gap: 2px; }
.statlabel { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.statnum {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums;
}
.neg { color: var(--neg); }
.stathint { font-size: 11px; color: var(--muted); }

.section { margin-bottom: 26px; }
.sechead { display: flex; align-items: baseline; justify-content: space-between; border-bottom: 1.5px solid var(--ink); padding-bottom: 6px; }
.sectitle { font-size: 14px; font-weight: 700; margin: 0; letter-spacing: -.01em; }
.sectotal { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
.secnote { font-size: 11px; color: var(--muted); margin: 6px 0 2px; }

.list { list-style: none; margin: 0; padding: 0; }
.empty { font-size: 13px; color: var(--muted); padding: 12px 0; }
.row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--rule); }
.row.done .name, .row.done .amount { color: var(--done); text-decoration: line-through; }

.check {
  flex: 0 0 22px; width: 22px; height: 22px; border-radius: 2px;
  border: 1.5px solid var(--rule); background: transparent; cursor: pointer;
  color: #fff; font-size: 13px; line-height: 1; padding: 0;
  display: flex; align-items: center; justify-content: center; font-family: inherit;
}
.check[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); }

.name {
  flex: 1 1 auto; min-width: 0; border: none; background: transparent;
  font-family: inherit; font-size: 16px; color: inherit; padding: 2px 0;
}
.amount {
  flex: 0 0 92px; border: none; background: transparent; text-align: right;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 16px; font-variant-numeric: tabular-nums; color: inherit; padding: 2px 0;
}
.name:focus, .amount:focus { outline: none; box-shadow: 0 1.5px 0 var(--accent); }
.name::placeholder, .amount::placeholder { color: var(--done); }

.del { flex: 0 0 22px; background: none; border: none; cursor: pointer; color: var(--rule); font-size: 22px; line-height: 1; padding: 0; font-family: inherit; }
.del:active { color: var(--neg); }

.add { margin-top: 10px; background: none; border: none; cursor: pointer; color: var(--accent); font-family: inherit; font-size: 14px; font-weight: 600; padding: 6px 0; }

.foot { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--rule); padding-top: 12px; margin-top: 30px; }
.save { font-size: 11px; color: var(--muted); }
.wipe { background: none; border: none; cursor: pointer; color: var(--muted); font-family: inherit; font-size: 11px; padding: 0; }

button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
@media (max-width: 420px) { #available { font-size: 34px; } .stats { gap: 18px; } .amount { flex-basis: 80px; } }
</style>
</head>
<body>

<div class="eyebrow">Maandoverzicht</div>
<div class="monthnav">
  <button class="arrow" id="prev" aria-label="Vorige maand">&lsaquo;</button>
  <span id="month"></span>
  <button class="arrow" id="next" aria-label="Volgende maand">&rsaquo;</button>
</div>

<section class="summary">
  <span class="biglabel">Nu op je rekening</span>
  <span id="available">€ 0,00</span>
  <span class="bighint">binnengekomen min wat je al betaald hebt</span>

  <div class="bar"><div id="barPaid"></div><div id="barTodo"></div></div>

  <div class="stats">
    <div class="stat">
      <span class="statlabel">Nog te betalen</span>
      <span class="statnum" id="todo">€ 0,00</span>
    </div>
    <div class="stat">
      <span class="statlabel">Vrij te besteden</span>
      <span class="statnum" id="free">€ 0,00</span>
      <span class="stathint">na alle posten hieronder</span>
    </div>
  </div>
</section>

<div id="sections"></div>

<div class="foot">
  <span class="save" id="save">Bewaard op dit toestel</span>
  <button class="wipe" id="wipe">Alles wissen</button>
</div>

<script>
const KEY = "maandoverzicht-v1";
const MONTHS = ["januari","februari","maart","april","mei","juni","juli","augustus","september","oktober","november","december"];
const SECTIONS = [
  { id: "income", title: "Inkomsten", note: "Vink aan wat binnen is" },
  { id: "fixed",  title: "Vaste lasten", note: "Vink aan wat afgeschreven is" },
  { id: "goals",  title: "Sparen en beleggen", note: "Vink aan wat je overgemaakt hebt" },
];
const SEED = {
  income: [["Loon",400],["Basisbeurs",126],["Zorgtoeslag",129]],
  fixed:  [["Zorgverzekering",148.75],["Basic-Fit",24.99],["Simpel",11.34]],
  goals:  [["Buffer",15],["Aandelen",150],["Rijbewijs",50]],
};

const euro = n => new Intl.NumberFormat("nl-NL",{style:"currency",currency:"EUR",minimumFractionDigits:2}).format(isFinite(n)?n:0);
const uid = () => Math.random().toString(36).slice(2,9);
const num = v => parseFloat(String(v).replace(",", ".")) || 0;
const sum = rows => rows.reduce((t,r)=>t+num(r.amount),0);
const sumDone = rows => rows.filter(r=>r.done).reduce((t,r)=>t+num(r.amount),0);

let store = {};
try { store = JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e) { store = {}; }

const today = new Date();
let year = today.getFullYear(), month = today.getMonth();
const mk = () => year + "-" + String(month+1).padStart(2,"0");

function seedMonth() {
  const out = {};
  SECTIONS.forEach(s => out[s.id] = SEED[s.id].map(([name,amount]) => ({id:uid(),name,amount,done:false})));
  return out;
}
function carry(prev) {
  const out = {};
  SECTIONS.forEach(s => out[s.id] = (prev[s.id]||[]).map(r => ({...r, id:uid(), done:false})));
  return out;
}
function ensureMonth() {
  const k = mk();
  if (store[k]) return store[k];
  const earlier = Object.keys(store).filter(x => x < k).sort();
  store[k] = earlier.length ? carry(store[earlier[earlier.length-1]]) : seedMonth();
  save();
  return store[k];
}
function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify(store));
    document.getElementById("save").textContent = "Bewaard op dit toestel";
  } catch(e) {
    document.getElementById("save").textContent = "Kon niet bewaren";
  }
}

function updateTotals() {
  const d = store[mk()];
  const totalIn = sum(d.income), inDone = sumDone(d.income);
  const totalOut = sum(d.fixed) + sum(d.goals);
  const outDone = sumDone(d.fixed) + sumDone(d.goals);
  const outLeft = totalOut - outDone;
  const free = totalIn - totalOut;

  document.getElementById("available").textContent = euro(inDone - outDone);
  document.getElementById("todo").textContent = euro(outLeft);
  const freeEl = document.getElementById("free");
  freeEl.textContent = euro(free);
  freeEl.classList.toggle("neg", free < 0);

  const pPaid = totalIn > 0 ? Math.min(100, outDone/totalIn*100) : 0;
  const pTodo = totalIn > 0 ? Math.min(100-pPaid, outLeft/totalIn*100) : 0;
  document.getElementById("barPaid").style.width = pPaid + "%";
  document.getElementById("barTodo").style.width = pTodo + "%";

  SECTIONS.forEach(s => {
    const el = document.getElementById("total-" + s.id);
    if (el) el.textContent = euro(sum(d[s.id]));
  });
}

function render() {
  const d = ensureMonth();
  document.getElementById("month").textContent = MONTHS[month] + " " + year;

  const wrap = document.getElementById("sections");
  wrap.innerHTML = "";

  SECTIONS.forEach(s => {
    const sec = document.createElement("section");
    sec.className = "section";

    const head = document.createElement("div");
    head.className = "sechead";
    head.innerHTML = '<h2 class="sectitle"></h2><span class="sectotal" id="total-' + s.id + '"></span>';
    head.querySelector(".sectitle").textContent = s.title;
    sec.appendChild(head);

    const note = document.createElement("p");
    note.className = "secnote";
    note.textContent = s.note;
    sec.appendChild(note);

    const ul = document.createElement("ul");
    ul.className = "list";

    if (d[s.id].length === 0) {
      const li = document.createElement("li");
      li.className = "empty";
      li.textContent = "Nog geen regels. Voeg er een toe.";
      ul.appendChild(li);
    }

    d[s.id].forEach(r => {
      const li = document.createElement("li");
      li.className = "row" + (r.done ? " done" : "");

      const chk = document.createElement("button");
      chk.className = "check";
      chk.setAttribute("aria-pressed", r.done ? "true" : "false");
      chk.setAttribute("aria-label", r.done ? "Terugzetten" : "Afvinken");
      chk.textContent = r.done ? "✓" : "";
      chk.onclick = () => { r.done = !r.done; save(); render(); };

      const name = document.createElement("input");
      name.className = "name";
      name.value = r.name;
      name.placeholder = "Omschrijving";
      name.oninput = e => { r.name = e.target.value; save(); };

      const amt = document.createElement("input");
      amt.className = "amount";
      amt.value = r.amount;
      amt.placeholder = "0,00";
      amt.setAttribute("inputmode", "decimal");
      amt.oninput = e => { r.amount = e.target.value; save(); updateTotals(); };

      const del = document.createElement("button");
      del.className = "del";
      del.setAttribute("aria-label", "Regel verwijderen");
      del.textContent = "×";
      del.onclick = () => {
        d[s.id] = d[s.id].filter(x => x.id !== r.id);
        store[mk()][s.id] = d[s.id];
        save(); render();
      };

      li.append(chk, name, amt, del);
      ul.appendChild(li);
    });

    sec.appendChild(ul);

    const add = document.createElement("button");
    add.className = "add";
    add.textContent = "+ regel toevoegen";
    add.onclick = () => {
      d[s.id].push({id:uid(), name:"", amount:"", done:false});
      save(); render();
      const inputs = document.querySelectorAll("#sections .section:nth-of-type(" + (SECTIONS.indexOf(s)+1) + ") .name");
      if (inputs.length) inputs[inputs.length-1].focus();
    };
    sec.appendChild(add);

    wrap.appendChild(sec);
  });

  updateTotals();
}

function step(delta) {
  month += delta;
  if (month < 0) { month = 11; year--; }
  if (month > 11) { month = 0; year++; }
  render();
}

document.getElementById("prev").onclick = () => step(-1);
document.getElementById("next").onclick = () => step(1);
document.getElementById("wipe").onclick = () => {
  if (!confirm("Alles wissen en opnieuw beginnen?")) return;
  store = {};
  try { localStorage.removeItem(KEY); } catch(e) {}
  render();
};

render();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
</body>
</html>
